plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bsim'
version = '0.0.1'

android {
  namespace 'com.bsim'
  defaultConfig {
    minSdkVersion 28
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  compileOnly files('libs/bsimlib.aar', 'libs/omachannel.aar')
  implementation 'org.web3j:core:4.10.3'
}
