name: Android Build Workflow
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment to build (qa/prod)"
      commitSha:
        required: true
        type: string
        description: "Git commit to build"
      displayVersion:
        required: true
        type: string
        description: "Version label displayed in the app"
      artifactName:
        required: true
        type: string
        description: "The artifact name"
      buildAAB:
        required: true
        type: boolean
        description: "To build the aab"

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    env:
      APP_ENV: ${{ inputs.environment }}
      APP_DISPLAY_VERSION: ${{ inputs.displayVersion }}
      PASSWORD_CRYPTO_KEY: ${{ secrets.PASSWORD_CRYPTO_KEY }}
      CI: '1'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commitSha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install dependencies
        run: yarn install --immutable

      - name: Update versions
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          ./.github/scripts/update-versions.sh "$MARKETING_VERSION" "$BUILD_NUMBER"

      - name: Set up JDK environment
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: yarn expo prebuild --platform android --no-install

      - name: Prepare production signing
        if: inputs.environment == 'prod'
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          : "${UPLOAD_KEYSTORE:?Missing production keystore}"
          : "${SIGN_ALIAS:?Missing signing alias}"
          : "${SIGN_KEY:?Missing signing password}"
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/bimwallet-release.keystore"
          {
            printf 'SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/bimwallet-release.keystore"
            printf 'SIGNING_KEY_ALIAS=%s\n' "$SIGN_ALIAS"
            printf 'SIGNING_STORE_PASSWORD=%s\n' "$SIGN_KEY"
            printf 'SIGNING_KEY_PASSWORD=%s\n' "$SIGN_KEY"
          } >> "$GITHUB_ENV"

      - name: Build Android Release
        env:
          BUILD_AAB: ${{ inputs.buildAAB }}
          ARTIFACT_NAME: ${{ inputs.artifactName }}
        run: |
          mkdir -p artifact
          if [ "$BUILD_AAB" = true ]; then
            if [ "$APP_ENV" != prod ]; then
              echo "AAB publishing requires the production environment" >&2
              exit 1
            fi
            (cd android && ./gradlew :app:bundleRelease --console=plain)
            cp android/app/build/outputs/bundle/release/app-release.aab "artifact/$ARTIFACT_NAME"
          else
            (cd android && ./gradlew :app:assembleRelease --console=plain)
            cp android/app/build/outputs/apk/release/app-release.apk "artifact/$ARTIFACT_NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.artifactName}}
          path: ./artifact/${{ inputs.artifactName }}

      - name: Remove signing credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/bimwallet-release.keystore"
