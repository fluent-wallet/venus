name: Ios Build Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment to build (qa/prod)"
      commitSha:
        required: true
        type: string
        description: "Git commit to build"
      displayVersion:
        required: true
        type: string
        description: "Version label displayed in the app"

jobs:
  ios-build:
    name: IOS Build
    runs-on: macos-26
    env:
      APP_ENV: ${{ inputs.environment }}
      APP_DISPLAY_VERSION: ${{ inputs.displayVersion }}
      PASSWORD_CRYPTO_KEY: ${{ secrets.PASSWORD_CRYPTO_KEY }}
      CI: '1'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commitSha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install dependencies
        run: yarn install --immutable

      - name: Update versions
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          ./.github/scripts/update-versions.sh "$MARKETING_VERSION" "$BUILD_NUMBER"

      - name: Generate iOS project
        run: yarn expo prebuild --platform ios --no-install

      - name: Install Pods
        run: cd ios && pod install --repo-update

      - name: Locate generated Xcode project
        id: native
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const entries = fs.readdirSync('ios');
          const project = entries.filter(name => name.endsWith('.xcodeproj'));
          const workspace = entries.filter(name => name.endsWith('.xcworkspace'));
          if (project.length !== 1 || workspace.length !== 1) {
            throw new Error('Expected one generated Xcode project and workspace');
          }
          const scheme = project[0].replace(/\.xcodeproj$/, '');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `project=ios/${project[0]}\nworkspace=ios/${workspace[0]}\nscheme=${scheme}\n`);
          JS

      - name: Build IOS App
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: ${{ steps.native.outputs.project }}
          p12-base64: ${{ secrets.IOS_P12_BASE64 }}
          mobileprovision-base64: ${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}
          team-id: ${{ secrets.IOS_TEAM_ID }}
          certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          workspace-path: ${{ steps.native.outputs.workspace }}
          scheme: ${{ steps.native.outputs.scheme }}
          code-signing-identity: "iPhone Distribution"
          output-path: "bimwallet.ipa"

      - name: Install private API key P8
        env:
          PRIVATE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$PRIVATE_API_KEY_BASE64" | base64 --decode --output ~/private_keys/AuthKey_$API_KEY.p8

      - name: "Upload app to TestFlight"
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID  }}
        run: |
          xcrun altool --output-format xml --upload-app -f ./bimwallet.ipa -t ios --apiKey $API_KEY --apiIssuer $API_ISSUER
