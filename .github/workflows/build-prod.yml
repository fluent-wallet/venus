name: Android build prod by release

permissions:
  contents: write

on:
  push:
    branches:
      - main
jobs:
  versions:
    uses: ./.github/workflows/versions.yml
    with:
      commitSha: ${{ github.sha }}

  createTag:
    needs: [versions]
    uses: ./.github/workflows/createTag.yml
    with:
      tag: ${{ needs.versions.outputs.PROD_TAG }}

  android-build:
    needs: [versions, createTag]
    uses: ./.github/workflows/build-android-and-upload.yml
    secrets: inherit
    with:
      environment: prod
      commitSha: ${{ github.sha }}
      displayVersion: ${{ needs.versions.outputs.PROD_VERSION }}
      artifactName: app-prod-release.apk
      buildAAB: false

  upload-to-release:
    name: upload to release
    runs-on: ubuntu-latest
    needs: [versions,android-build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-prod-release.apk
          path: .
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.versions.outputs.PROD_TAG }}
          name: ${{ needs.versions.outputs.PROD_TAG }}
          files: |
            ./app-prod-release.apk

      - name: install OSSUTIL
        run: |
          sudo -v ; curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
      - name: Configure OSS
        env:
          OSS_KEY: ${{ secrets.OSS_KEY }}
          OSS_ID: ${{ secrets.OSS_ID }}
        run: |
          touch ~/.ossutilconfig
          chmod 644 ~/.ossutilconfig
          cat >>~/.ossutilconfig <<END
          [Credentials]
          language=EN
          endpoint=oss-cn-hongkong.aliyuncs.com
          accessKeyID=$OSS_ID
          accessKeySecret=$OSS_KEY
          END
      - name: Upload to OSS
        run: yes | ossutil64 cp ./app-prod-release.apk oss://blockvenus-hk/apks/BIMWallet.apk

  uploadUpdateNote:
    needs: [android-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: install OSSUTIL
        run: |
          sudo -v ; curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
      - name: Configure OSS
        env:
          OSS_KEY: ${{ secrets.OSS_KEY }}
          OSS_ID: ${{ secrets.OSS_ID }}
        run: |
          touch ~/.ossutilconfig
          chmod 644 ~/.ossutilconfig
          cat >>~/.ossutilconfig <<END
          [Credentials]
          language=EN
          endpoint=oss-cn-hongkong.aliyuncs.com
          accessKeyID=$OSS_ID
          accessKeySecret=$OSS_KEY
          END

      - name: Upload Update Note
        run: yes | ossutil64 cp ./version.json oss://blockvenus-hk/version.json

  ios-build:
    name: IOS Build
    needs: [versions, createTag]
    uses: ./.github/workflows/build-ios-and-upload.yml
    secrets: inherit
    with:
      environment: prod
      commitSha: ${{ github.sha }}
      displayVersion: ${{ needs.versions.outputs.PROD_VERSION }}
