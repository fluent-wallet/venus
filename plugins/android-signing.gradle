// Production requires explicit credentials; dev and QA can use debug signing.
def venusKeystore = System.getenv('SIGNING_KEYSTORE')
if (venusKeystore) {
  if (!System.getenv('SIGNING_STORE_PASSWORD') || !System.getenv('SIGNING_KEY_ALIAS')) {
    throw new GradleException('SIGNING_KEYSTORE requires SIGNING_STORE_PASSWORD and SIGNING_KEY_ALIAS')
  }
  android.signingConfigs {
    provided {
      storeFile file(venusKeystore)
      storePassword System.getenv('SIGNING_STORE_PASSWORD')
      keyAlias System.getenv('SIGNING_KEY_ALIAS')
      keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: System.getenv('SIGNING_STORE_PASSWORD')
    }
  }
  android.buildTypes.debug.signingConfig = android.signingConfigs.provided
  android.buildTypes.release.signingConfig = android.signingConfigs.provided
} else if (android.defaultConfig.applicationId == 'io.bimwallet') {
  throw new GradleException('Production builds require SIGNING_KEYSTORE and signing credentials')
} else {
  android.buildTypes.release.signingConfig = android.signingConfigs.debug
}
